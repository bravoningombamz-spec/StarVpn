workflows:
  ios-build:
    name: Star VPN iOS Build
    max_build_duration: 60
    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml

      - name: Build archive (unsigned)
        script: |
          xcodebuild \
            -project StarVPN.xcodeproj \
            -scheme StarVPN \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/StarVPN.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package unsigned IPA
        script: |
          ARCHIVE="$CM_BUILD_DIR/build/StarVPN.xcarchive"
          APP_PATH="$ARCHIVE/Products/Applications/StarVPN.app"
          IPA_DIR="$CM_BUILD_DIR/build/ipa"
          PAYLOAD="$IPA_DIR/Payload"

          mkdir -p "$PAYLOAD"
          cp -r "$APP_PATH" "$PAYLOAD/"

          cd "$IPA_DIR"
          zip -r "$CM_BUILD_DIR/StarVPN_unsigned.ipa" Payload/

          echo "✅ IPA created: $CM_BUILD_DIR/StarVPN_unsigned.ipa"
          ls -lh "$CM_BUILD_DIR/StarVPN_unsigned.ipa"

    artifacts:
      - $CM_BUILD_DIR/StarVPN_unsigned.ipa
      - $CM_BUILD_DIR/build/StarVPN.xcarchive
